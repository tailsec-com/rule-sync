name: Weekly Rule Sync
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run sync
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: sync latest CVE rules"
          branch: chore/sync-rules
          commit-message: "chore: sync latest CVE rules"